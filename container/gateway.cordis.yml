# DSH remains the harness. pi-ai is only its model transport adapter.
- id: llm-pi-ai
  config:
    providers:
      cloudflare-gateway:
        apiKeyEnv: DSH_GATEWAY_PLACEHOLDER
        api: openai-completions
        baseURL: https://api.openai.com/v1
        models:
          - id: dsh-model
            contextWindow: 65536
            maxTokens: 8192
- id: agent-default-model
  config:
    provider: cloudflare-gateway
    model: dsh-model
- id: tool-web
  disabled: true
